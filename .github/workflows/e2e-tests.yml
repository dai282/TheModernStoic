name: E2E Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        run: npm install
        working-directory: ./src/frontend/TheModernStoic

      - name: Build Frontend
        run: npm run build
        working-directory: ./src/frontend/TheModernStoic
        env:
          VITE_API_BASE_URL: http://localhost:5289/api

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        working-directory: ./src/frontend/TheModernStoic

      - name: Start Backend
        run: dotnet run --project ./src/backend/TheModernStoic.API/TheModernStoic.API.csproj --urls "http://localhost:5289" &
        env:
          CosmosDb__ConnectionString: "AccountEndpoint=https://localhost:8081/;AccountKey=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw=="
          AI__HuggingFaceApiKey: "dummy-key"
          # Disable HTTPS redirection in CI to avoid SSL issues with wait-on
          ASPNETCORE_URLS: "http://localhost:5289"
          ASPNETCORE_ENVIRONMENT: "Development"

      - name: Start Frontend
        run: npx serve -s ./src/frontend/TheModernStoic/dist -l 3000 &

      - name: Wait for servers
        run: |
          npm install -g wait-on
          npx wait-on -v -t 60000 http://localhost:5289/health http://localhost:3000

      - name: Run Playwright Tests
        run: npx playwright test
        working-directory: ./src/frontend/TheModernStoic
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/frontend/TheModernStoic/playwright-report/
          retention-days: 30
